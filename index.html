<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKK AIR FORCE ONE - REALTIME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #e0f2fe; 
            margin: 0; 
            display: flex; 
            justify-content: center;
        }
        .oswald { font-family: 'Oswald', sans-serif; }
        
        .app-container {
            width: 100%;
            max-w: 430px; 
            min-height: 100vh;
            background: linear-gradient(180deg, #0ea5e9 0%, #38bdf8 50%, #7dd3fc 100%);
            color: white;
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
        }

        .blue-box {
            background-color: #0b3b84;
            border-radius: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #0ea5e9; z-index: 50; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-container px-6 py-8">
        
        <div id="loading" class="loading-overlay">
            <div class="spinner mb-4"></div>
            <p class="font-bold tracking-widest animate-pulse">UPDATING SKY...</p>
        </div>

        <div class="flex justify-between items-start">
            <div>
                <h2 class="text-sm font-bold tracking-wide">BKK AIR FORCE ONE</h2>
                <h1 class="text-5xl font-black mt-1 uppercase oswald tracking-tight leading-none drop-shadow-md">BANGKOK</h1>
                <h1 class="text-5xl font-black uppercase oswald tracking-wide leading-none drop-shadow-md">REAL-TIME</h1>
            </div>
            <div class="text-right">
                <h2 class="text-4xl font-normal text-red-500 oswald tracking-wide drop-shadow-sm" id="time-display">00:00</h2>
                <p class="text-base text-red-500 font-bold" id="date-display">--</p>
            </div>
        </div>

        <div class="mt-8 flex justify-between items-end">
            <div class="flex items-baseline">
                <span class="text-2xl font-bold mb-2 mr-2">ฝนตก</span>
                <span class="text-8xl font-black text-red-500 oswald leading-none drop-shadow-md" id="rain-percent">0</span>
                <span class="text-4xl font-black text-red-500 oswald ml-1">%</span>
            </div>
            <div class="text-right pb-1">
                <p class="text-sm font-bold mb-[-5px]">ปริมาณน้ำฝน</p>
                <div class="flex items-baseline justify-end">
                    <span class="text-6xl font-black text-red-500 oswald drop-shadow-md" id="rain-amount">0.0</span> 
                    <span class="text-xl font-bold ml-2">มม.</span>
                </div>
                <p class="text-xs font-bold mt-1">ของพื้นที่กรุงเทพมหานคร</p>
            </div>
        </div>

        <div class="flex justify-end gap-8 mt-6 mb-8">
            <div class="text-center">
                <p class="text-sm font-bold mb-[-5px]">ความเร็วลม</p>
                <span class="text-4xl font-black text-red-500 oswald drop-shadow-md" id="wind-speed">0</span><br>
                <span class="text-[10px] font-bold uppercase">km/h</span>
            </div>
            <div class="text-center">
                <p class="text-sm font-bold mb-[-5px]">ทิศทางลม</p>
                <span class="text-4xl font-black text-red-500 oswald drop-shadow-md" id="wind-dir">--</span>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-3 flex-grow">
            
            <div class="flex flex-col items-center">
                <p class="text-[10px] sm:text-xs font-bold mb-1 shadow-black drop-shadow-md text-center leading-tight whitespace-nowrap">อัตราการระบายอากาศ</p>
                <div class="blue-box w-full aspect-square"><span class="text-sm font-bold text-slate-400">N/A</span></div>
            </div>
            <div class="flex flex-col items-center">
                <p class="text-[10px] sm:text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight whitespace-nowrap">ความกดอากาศ</p>
                <div class="blue-box w-full aspect-square"><span class="text-lg font-bold oswald" id="p-pressure">--</span><span class="text-[8px]">hPa</span></div>
            </div>
            <div class="col-span-1 row-span-2 flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight">AQI</p>
                <div class="blue-box w-full h-full p-2">
                    <span class="text-5xl font-black oswald" id="p-aqi">--</span>
                </div>
            </div>

            <div class="flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight">PM10</p>
                <div class="blue-box w-full aspect-square"><span class="text-xl font-bold oswald" id="p-pm10">--</span></div>
            </div>
            <div class="flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight">PM2.5</p>
                <div class="blue-box w-full aspect-square"><span class="text-xl font-bold oswald" id="p-pm25">--</span></div>
            </div>

            <div class="flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight">O3</p>
                <div class="blue-box w-full aspect-square"><span class="text-xl font-bold oswald" id="p-o3">--</span></div>
            </div>
            <div class="flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight">NO2</p>
                <div class="blue-box w-full aspect-square"><span class="text-xl font-bold oswald" id="p-no2">--</span></div>
            </div>
            <div class="col-span-1 row-span-2 flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight whitespace-nowrap">HEAT INDEX</p>
                <div class="blue-box w-full h-full p-2 relative">
                    <span class="text-4xl font-black oswald mb-4" id="p-heat">--</span>
                    <div class="absolute bottom-3 w-full px-3 flex justify-between text-[9px] font-bold text-cyan-200 uppercase">
                        <span>TEMP: <span id="p-temp" class="text-white">--</span></span>
                        <span>RH: <span id="p-rh" class="text-white">--</span></span>
                    </div>
                </div>
            </div>

            <div class="flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight">CO</p>
                <div class="blue-box w-full aspect-square"><span class="text-xl font-bold oswald" id="p-co">--</span></div>
            </div>
            <div class="flex flex-col items-center">
                <p class="text-xs font-bold mb-1 shadow-black drop-shadow-md leading-tight">SO2</p>
                <div class="blue-box w-full aspect-square"><span class="text-xl font-bold oswald" id="p-so2">--</span></div>
            </div>
            
        </div>

        <div class="flex justify-between items-center mt-6 mb-2 px-2">
            <div class="flex gap-2">
                <div class="w-2.5 h-2.5 bg-white rounded-full shadow-md"></div>
                <div class="w-2.5 h-2.5 bg-white/50 rounded-full shadow-md"></div>
                <div class="w-2.5 h-2.5 bg-white/50 rounded-full shadow-md"></div>
            </div>
            
            <button class="bg-[#0b3b84] text-white px-8 py-2.5 rounded-full font-bold text-sm shadow-[0_4px_10px_rgba(0,0,0,0.2)] hover:bg-[#1e40af] transition-colors active:scale-95">
                พยากรณ์
            </button>
            
            <div class="flex gap-2">
                <div class="w-2.5 h-2.5 bg-white/50 rounded-full shadow-md"></div>
                <div class="w-2.5 h-2.5 bg-white/50 rounded-full shadow-md"></div>
                <div class="w-2.5 h-2.5 bg-white/50 rounded-full shadow-md"></div>
            </div>
        </div>

    </div>

    <script>
        // System Clock & Date
        setInterval(() => {
            const now = new Date();
            document.getElementById('time-display').innerText = now.toLocaleTimeString('en-US', {hour12: false, hour: '2-digit', minute: '2-digit'});
            document.getElementById('date-display').innerText = now.toLocaleDateString('en-GB', {day: 'numeric', month: 'long'});
        }, 1000);

        function getWindDir(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(deg / 45) % 8];
        }

        const bkkDistricts = [
            {lat: 13.76, lon: 100.49}, {lat: 13.75, lon: 100.51}, {lat: 13.74, lon: 100.52}, {lat: 13.73, lon: 100.52}, {lat: 13.71, lon: 100.52},
            {lat: 13.69, lon: 100.54}, {lat: 13.71, lon: 100.58}, {lat: 13.74, lon: 100.58}, {lat: 13.76, lon: 100.53}, {lat: 13.78, lon: 100.54},
            {lat: 13.78, lon: 100.52}, {lat: 13.82, lon: 100.52}, {lat: 13.82, lon: 100.56}, {lat: 13.78, lon: 100.58}, {lat: 13.76, lon: 100.56},
            {lat: 13.76, lon: 100.64}, {lat: 13.78, lon: 100.66}, {lat: 13.80, lon: 100.60}, {lat: 13.78, lon: 100.60}, {lat: 13.73, lon: 100.63},
            {lat: 13.71, lon: 100.67}, {lat: 13.70, lon: 100.60}, {lat: 13.67, lon: 100.61}, {lat: 13.78, lon: 100.34}, {lat: 13.70, lon: 100.35},
            {lat: 13.71, lon: 100.39}, {lat: 13.72, lon: 100.43}, {lat: 13.77, lon: 100.43}, {lat: 13.79, lon: 100.49}, {lat: 13.76, lon: 100.47},
            {lat: 13.72, lon: 100.48}, {lat: 13.73, lon: 100.50}, {lat: 13.72, lon: 100.49}, {lat: 13.69, lon: 100.46}, {lat: 13.68, lon: 100.50},
            {lat: 13.63, lon: 100.49}, {lat: 13.61, lon: 100.43}, {lat: 13.65, lon: 100.39}, {lat: 13.91, lon: 100.64}, {lat: 13.91, lon: 100.59},
            {lat: 13.88, lon: 100.57}, {lat: 13.86, lon: 100.60}, {lat: 13.87, lon: 100.72}, {lat: 13.81, lon: 100.74}, {lat: 13.85, lon: 100.86},
            {lat: 13.72, lon: 100.78}, {lat: 13.76, lon: 100.68}, {lat: 13.81, lon: 100.67}, {lat: 13.73, lon: 100.50}, {lat: 13.69, lon: 100.50}
        ];

        async function fetchAllData() {
            try {
                const lats = bkkDistricts.map(d => d.lat).join(',');
                const lons = bkkDistricts.map(d => d.lon).join(',');
                
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=precipitation,wind_speed_10m,wind_direction_10m,surface_pressure,temperature_2m,relative_humidity_2m,apparent_temperature&timezone=Asia/Bangkok`;
                const res = await fetch(url);
                const data = await res.json();

                const aqUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=13.75&longitude=100.50&current=pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,sulphur_dioxide,ozone,european_aqi&timezone=Asia/Bangkok`;
                const aqRes = await fetch(aqUrl);
                const aqData = await aqRes.json();

                processAppView(data, aqData);
                document.getElementById('loading').style.display = 'none';
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('loading').innerHTML = `<p class='text-red-800 font-bold'>CONNECTION FAILED</p>`;
            }
        }

        function processAppView(apiData, aqData) {
            let rainingDistricts = 0;
            let maxRain = 0;
            
            apiData.forEach(site => {
                let rain = site.current.precipitation;
                if(rain > 0) rainingDistricts++;
                if(rain > maxRain) maxRain = rain;
            });
            
            let rainPercent = Math.round((rainingDistricts / 50) * 100);
            let centerCur = apiData[0].current;
            let aq = aqData.current;

            document.getElementById('rain-percent').innerText = rainPercent;
            document.getElementById('rain-amount').innerText = maxRain.toFixed(1); 
            
            document.getElementById('wind-speed').innerText = centerCur.wind_speed_10m.toFixed(0);
            document.getElementById('wind-dir').innerText = getWindDir(centerCur.wind_direction_10m);
            
            document.getElementById('p-pressure').innerText = centerCur.surface_pressure.toFixed(0);
            
            document.getElementById('p-aqi').innerText = aq.european_aqi != null ? aq.european_aqi : "--";
            document.getElementById('p-pm10').innerText = aq.pm10 != null ? aq.pm10 : "--";
            document.getElementById('p-pm25').innerText = aq.pm2_5 != null ? aq.pm2_5 : "--";
            document.getElementById('p-o3').innerText = aq.ozone != null ? Math.round(aq.ozone) : "--";
            document.getElementById('p-no2').innerText = aq.nitrogen_dioxide != null ? Math.round(aq.nitrogen_dioxide) : "--";
            document.getElementById('p-co').innerText = aq.carbon_monoxide != null ? aq.carbon_monoxide.toFixed(1) : "--";
            document.getElementById('p-so2').innerText = aq.sulphur_dioxide != null ? Math.round(aq.sulphur_dioxide) : "--";

            document.getElementById('p-heat').innerText = centerCur.apparent_temperature.toFixed(1);
            document.getElementById('p-temp').innerText = Math.round(centerCur.temperature_2m);
            document.getElementById('p-rh').innerText = Math.round(centerCur.relative_humidity_2m);
        }

        fetchAllData();
        setInterval(fetchAllData, 300000); 
    </script>
</body>
</html>
